[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "ASYNC", # async correctness (blocking calls, etc.)
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "SIM",   # flake8-simplify
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = [
    "E501",  # formatter already wraps what it can; long log/comment strings are left alone
    "UP007", # keep `Optional[X]` / `X | None` interchangeable, not enforced
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.grohe_smarthome"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
